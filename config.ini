# =====================================================================
#  Network configuration for the Wi-Fi + emulated 5G experiment
#
#  Edit the numbers below and re-run a script; no code changes needed.
#    capacity_mbps : link capacity in Mbit/s
#    delay_ms      : one-way delay in milliseconds (round trip = 2 x this)
#    loss_pct      : packet loss in percent (1 = 1 %, 0.1 = 0.1 %)
# =====================================================================

[wifi]
capacity_mbps = 130
delay_ms      = 10
loss_pct      = 1
# distance between station and access point in metres; sets the radio
# path loss (signal strength). Keep it small (under ~20 m) so it stays in range
distance_m    = 5

[5g]
capacity_mbps = 700
delay_ms      = 15
loss_pct      = 0.1

# ---------------------------------------------------------------------
#  Background traffic generated with iPerf3 (UDP), as a share of capacity
# ---------------------------------------------------------------------
[background]
# constant level used by wifi_5g_topology.py and sweep.py (0.60 = 60 %)
share = 0.60

# varying traffic used by vary_traffic.py:
#   every step_s seconds the load jumps to a random level
#   between min_share and max_share (average is about the middle)
min_share = 0.30
max_share = 0.90
step_s    = 5

# ---------------------------------------------------------------------
#  Test settings
# ---------------------------------------------------------------------
[test]
# length of one test run in seconds
duration_s = 60
# same seed = same random traffic pattern, so runs can be compared
seed       = 1

# ---------------------------------------------------------------------
#  Video test (video_stream.py): a real video is sent from sta1 to srv,
#  over each network one at a time
# ---------------------------------------------------------------------
[video]
# video file to send; leave empty to use a built-in test video
file         =
# video bitrate in Mbit/s and how many seconds to send
bitrate_mbps = 4
length_s     = 20
# udp = live streaming (losses show as broken frames)
# tcp = reliable transfer (losses are resent, delivery takes longer)
transport    = udp
# yes = add iPerf background traffic (share from [background]) during the video
background   = yes

# ---------------------------------------------------------------------
#  Changing conditions during the video (video_stream.py)
#  Every step_s seconds (from [background]) the network changes at random:
#    background : random level between min_share and max_share
#    capacity   : config value +/- capacity_pct %
#    delay      : config value +/- delay_pct %
#    loss       : config value +/- loss_pct %  (100 = between 0 and 2x)
#  On average the values stay at the ones above (130/700 Mbit/s,
#  10/15 ms, 1/0.1 %, ~60 % background). Set enabled = no for fixed values.
# ---------------------------------------------------------------------
[vary]
enabled      = yes
capacity_pct = 30
delay_pct    = 50
loss_pct     = 100

# ---------------------------------------------------------------------
#  Part 6 - adaptive I-frame path switching (adaptive_test.py)
#  A long video is sent while the capacity of both paths changes.
#  Before every segment the sender measures both paths; the better one
#  carries the I frames (QUIC stream), the other one the P/B frames
#  (QUIC datagrams). Background stays at [background] share x the
#  capacities below (5G 420, Wi-Fi 300 Mbit/s), so a path whose capacity
#  drops below its background is congested.
# ---------------------------------------------------------------------
[adaptive]
# video length (the source video is looped) and segment length
video_minutes      = 15
segment_s          = 20
# nominal capacities of this part (Mbit/s)
capacity_5g_mbps   = 700
capacity_wifi_mbps = 500
# capacity timeline: time_s:5G_mbps:WiFi_mbps, straight lines in between.
#   0-80 s    5G strong (700) > Wi-Fi (500)      -> I frames on 5G
#   120-200 s 5G drops to 300 (below its 420 background) -> I frames on Wi-Fi
#   240-320 s 5G back to 700, Wi-Fi drops to 250 -> I frames on 5G
#   360-440 s both strong again
#   480-560 s 5G drops to 250                    -> Wi-Fi
#   600-680 s Wi-Fi drops to 250                 -> 5G
#   720-900 s both strong
timeline = 0:700:500, 80:700:500, 120:300:500, 200:300:500, 240:700:250, 320:700:250,
           360:700:500, 440:700:500, 480:250:500, 560:250:500, 600:700:250, 680:700:250,
           720:700:500, 900:700:500
# path measurement before every segment: UDP burst of probe_mbps for probe_s seconds on
# each path; switch only if the other path delivered switch_margin (15 %) more
probe_s            = 1
probe_mbps         = 300
switch_margin      = 0.15
